<section id="contact" class="contact-section py-5">
  <div class="container">

    <!-- Section Heading -->
    <div class="text-center mb-5">
      <h2 class="fw-bold">CONTACT ME</h2>
      <p>Have a project in mind? Let's work together!</p>
    </div>

    <div class="row g-5">

      <!-- Contact Information -->
      <div class="col-md-5">
        <h4 class="fw-bold mb-4">Get In Touch</h4>

        <div class="d-flex align-items-center mb-4">
          <i class="bi bi-envelope-fill fs-3 me-3"></i>
          <div>
            <h6 class="mb-1">Email</h6>
            <p class="mb-0">uzairgulzar51@gmail.com</p>
          </div>
        </div>

        <div class="d-flex align-items-center mb-4">
          <i class="bi bi-github fs-3 me-3"></i>
          <div>
            <h6 class="mb-1">GitHub</h6>
            <a href="https://github.com/uzairDev8" target="_blank" rel="noopener noreferrer">
              GitHub Profile
            </a>
          </div>
        </div>

        <div class="d-flex align-items-center mb-4">
          <i class="bi bi-linkedin fs-3 me-3"></i>
          <div>
            <h6 class="mb-1">LinkedIn</h6>
            <a href="https://www.linkedin.com/in/sheikhuzair1/" target="_blank" rel="noopener noreferrer">
              LinkedIn Profile
            </a>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="col-md-7">
        <form #contactForm="ngForm" (ngSubmit)="sendMessage()">

          <!-- Name -->
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input id="name" type="text" class="form-control" name="name" [(ngModel)]="formData.name"
              placeholder="Enter your name" required />
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input id="email" type="email" class="form-control" name="email" [(ngModel)]="formData.email"
              placeholder="Enter your email" required email />
          </div>

          <!-- Subject -->
          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input id="subject" type="text" class="form-control" name="subject" [(ngModel)]="formData.subject"
              placeholder="Enter subject" required />
          </div>

          <!-- Message -->
          <div class="mb-3">
            <label for="message" class="form-label">Your Message</label>
            <textarea id="message" class="form-control" name="message" [(ngModel)]="formData.message" rows="5"
              placeholder="Write your message..." required></textarea>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary px-4" [disabled]="isSending || contactForm.invalid">
            <span *ngIf="isSending" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>

            {{ isSending ? 'Sending...' : 'Send Message' }}
          </button>

          <!-- Success / Error Message -->
          <p class="mt-3" aria-live="polite" [class.text-success]="statusMessage.includes('successfully')"
            [class.text-danger]="statusMessage.includes('failed')">
            {{ statusMessage }}
          </p>

        </form>
      </div>

    </div>
  </div>
</section>
